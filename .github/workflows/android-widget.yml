name: Android widget APK

on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          # このブランチのビルドでも依存ライブラリをキャッシュに保存する
          cache-read-only: false
      # ubuntu-latest には Android SDK がプリインストール済み（ANDROID_HOME）
      - name: Build APK
        run: |
          chmod +x gradlew
          # 依存ライブラリのダウンロードが一時的に失敗（429 など）しても、最大3回まで再試行する
          for i in 1 2 3; do
            ./gradlew --no-daemon assembleRelease && break
            if [ "$i" = 3 ]; then exit 1; fi
            echo "Build failed (attempt $i). Retrying in 60s..."
            sleep 60
          done
          cp app/build/outputs/apk/release/app-release.apk itami-negai-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: itami-negai-widget-apk
          path: android-widget/itami-negai-widget.apk
