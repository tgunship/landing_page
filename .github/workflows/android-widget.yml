name: Android widget APK

on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      # ubuntu-latest には Android SDK がプリインストール済み（ANDROID_HOME）
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk itami-negai-widget.apk
      - uses: actions/upload-artifact@v4
        with:
          name: itami-negai-widget-apk
          path: android-widget/itami-negai-widget.apk
