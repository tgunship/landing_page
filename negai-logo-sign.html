<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>願いのロゴ化 看板</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Shippori+Mincho:wght@500;600;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  @page { size: A4 landscape; margin: 0; }
  :root {
    --paper: #fbf7f0; --ink: #1c1d40; --ink-soft: #5d5e78; --navy: #15174d;
    --orange: #f2762e; --pink: #e84a7f; --purple: #6c3fd1; --sky: #2fb4d8; --yellow: #f4c13d; --teal: #12838b;
    --mincho: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", serif;
    --pen: "Klee One", "Hiragino Maru Gothic ProN", sans-serif;
    --sans: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #d9d3c7; }
  body { font-family: var(--sans); color: var(--ink); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  @media screen { body { padding: 24px 0; } .sheet { margin: 0 auto; box-shadow: 0 10px 40px rgba(0,0,0,.18); } }
  @media print { html, body { background: none; } }

  .sheet { width: 297mm; height: 210mm; background: var(--paper); position: relative; overflow: hidden;
    display: grid; grid-template-columns: 1fr 104mm; gap: 8mm; padding: 13mm 13mm 12mm 16mm; }
  .deco { position: absolute; pointer-events: none; }

  /* 左 */
  .main { position: relative; z-index: 1; display: flex; flex-direction: column; }
  .brand { display: inline-flex; align-self: flex-start; align-items: center; gap: .7em; background: var(--navy); color: #fff;
    font-family: var(--mincho); font-weight: 700; font-size: 17pt; letter-spacing: .12em; padding: 1.6mm 6mm 1.6mm 4.5mm; border-radius: 99px; }
  .brand svg { width: 9mm; height: 9mm; }
  .brand small { font-family: var(--pen); font-weight: 600; font-size: 11pt; letter-spacing: .1em; opacity: .8; }
  h1 { font-family: var(--mincho); font-weight: 800; font-size: 49pt; line-height: 1.42; letter-spacing: .02em; margin-top: 13mm; white-space: nowrap; }
  h1 .q { color: var(--pink); }
  h1 em { font-style: normal; background: linear-gradient(transparent 64%, rgba(244,193,61,.75) 64%); }
  h1 .w { color: var(--pink); } h1 .e { color: var(--purple); }
  .sub { font-size: 15pt; font-weight: 700; line-height: 1.8; margin-top: 8mm; letter-spacing: .04em; }

  .steps { list-style: none; display: flex; align-items: center; gap: 3mm; margin-top: auto; }
  .steps li { flex: 1; background: #fff; border: 1.8px solid var(--ink); border-radius: 18px; padding: 4mm 2mm 3.5mm; text-align: center; }
  .steps svg { width: 21mm; height: 21mm; display: block; margin: 0 auto 1.5mm; }
  .steps b { display: block; font-family: var(--mincho); font-weight: 800; font-size: 17pt; letter-spacing: .04em; line-height: 1.35; }
  .steps .arrow { flex: 0 0 auto; width: 7mm; height: 7mm; border: 0; background: none; padding: 0; }
  .steps .arrow::before { content: ""; display: block; width: 0; height: 0; border-left: 6mm solid var(--orange); border-top: 3.5mm solid transparent; border-bottom: 3.5mm solid transparent; margin: 0 auto; }

  /* 右 */
  .side { position: relative; z-index: 1; display: flex; flex-direction: column; }
  .photo img { width: 100%; aspect-ratio: 4 / 3.4; object-fit: cover; object-position: 38% 50%; display: block;
    border-radius: 38% 62% 42% 58% / 46% 40% 60% 54%; box-shadow: 0 10px 24px rgba(28,29,64,.18); transform: rotate(-2deg); }
  .bubble { position: relative; background: var(--orange); color: #fff; border-radius: 22px; padding: 5mm 5mm 4.5mm; text-align: center; margin-top: 8mm; }
  .bubble::before { content: ""; position: absolute; top: -5mm; left: 22mm; border-left: 5mm solid transparent; border-right: 5mm solid transparent; border-bottom: 6mm solid var(--orange); }
  .bubble b { display: block; font-size: 21pt; font-weight: 900; letter-spacing: .06em; line-height: 1.35; }
  .bubble span { display: block; font-size: 11.5pt; font-weight: 700; margin-top: 1.5mm; letter-spacing: .04em; }
  .qr { margin-top: auto; display: flex; align-items: center; gap: 4mm; background: #fff; border-radius: 14px; padding: 3mm 4mm; }
  .qr svg { width: 20mm; height: 20mm; flex-shrink: 0; }
  .qr p { font-size: 11pt; font-weight: 700; line-height: 1.5; }
  .qr p span { display: block; font-size: 9pt; font-weight: 500; color: var(--ink-soft); }
</style>
</head>
