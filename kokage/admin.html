<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>木陰｜運営メニュー</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#12838b">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap wide">
    <header class="brand">
      <p class="brand__name">木陰</p>
      <p class="brand__sub">運営メニュー</p>
    </header>

    <nav class="tabs">
      <button data-tab="create" class="active">木陰をつくる</button>
      <button data-tab="events">イベント一覧</button>
      <button data-tab="requests">テーマのお便り</button>
    </nav>

    <main id="app"><div class="loading"><div class="spinner"></div>読み込んでいます…</div></main>
  </div>

  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="poster.js"></script>
  <script>
  (function () {
    const { initLiff, api, yen, esc, $, $$, toast } = Kokage;
    const BACKGROUNDS = [
      { id: 'tree', src: '../images/bg-tree.webp' },
      { id: 'window', src: '../images/bg-window.webp' },
      { id: 'table', src: '../images/bg-table.webp' },
      { id: 'cards', src: '../images/bg-cards.webp' }
    ];
    const S = {
      tab: 'create', data: null,
      form: null, bgId: 'tree', bgImg: null, uploadImg: null, format: 'post',
      generating: false, published: null, eventFilter: 'upcoming'
    };

    $$('.tabs button').forEach((b) => b.addEventListener('click', () => { S.tab = b.dataset.tab; render(); }));

    const WD = ['日', '月', '火', '水', '木', '金', '土'];
    function dateLabel(iso) {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso || '');
      if (!m) return '';
      const d = new Date(+m[1], +m[2] - 1, +m[3]);
      return `${+m[2]}月${+m[3]}日（${WD[d.getDay()]}）`;
    }
    function addHours(t, h) {
      const m = /^(\d{1,2}):(\d{2})$/.exec(t || '');
      if (!m) return '';
      const total = +m[1] * 60 + +m[2] + h * 60;
      return String(Math.floor(total / 60) % 24).padStart(2, '0') + ':' + String(total % 60).padStart(2, '0');
    }
    function minDate() { return localIso(new Date()); }
    function localIso(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }

    function blankForm() {
      const c = S.data.config;
      return { hostId: S.data.me.id, format: '', workTitle: '', idea: '', date: '', start: c.start, venue: c.venue, venueFeeTotal: '', venueFeeCap: '', max: c.max, title: '', description: '', body: '' };
    }

    function captionInfo(f) {
      const c = S.data.config;
      const end = addHours(f.start, c.duration);
      return [
        '──────────',
        `🌿 ${seriesOf(f)}｜ここち${fmtOf(f) && fmtOf(f).kicker ? '（' + fmtOf(f).kicker + '）' : ''}`,
        `『${f.title || ''}』`,
        ...(workCaption(f) ? [workCaption(f)] : []),
        `📅 ${dateLabel(f.date)} ${f.start}〜${end}`,
        `📍 ${f.venue}`,
        ...(isOtherVenue(f)
          ? [`💴 参加費 はじめての方 ${yen(c.fees.first)}／2回目以降 ${yen(c.fees.regular)}`,
             Number(f.venueFeeTotal) > 0
               ? `　 ＋場所代 1人${yen(Number(f.venueFeeCap) || 0)}まで（合計${yen(Number(f.venueFeeTotal))}を参加者で割り勘。人数が増えると安くなります）`
               : '　 ＋場所代なし']
          : [`💴 はじめての方 ${yen(c.fees.first + c.fees.venue)}／2回目以降 ${yen(c.fees.regular + c.fees.venue)}（場所代${yen(c.fees.venue)}込み）`]),
        `　 参加後に感想をシェアしてくださる方は${yen(c.fees.discount)}引き`,
        `　 インナークエスト受講生は場所代のみ`,
        `🕊 前半${c.core}時間はじっくり、後半は感想の投稿やフリートーク`,
        '',
        `お申し込みは ${c.instagramHandle} のプロフィールのリンク（公式LINE）から`,
        '',
        '#木陰 #ここち #内面探求 #自己理解 #痛みと願いカード #ひたちなか #イバフォルニアベース'
      ].join('\n');
    }
    function fmtOf(f) { return S.data.formats.find((x) => x.key === f.format) || null; }
    function workCaption(f) {
      if (!f.workTitle) return '';
      if (f.format === 'movie') return `🎬 映画『${f.workTitle}』を事前に観てきてください`;
      if (f.format === 'reading') return `📖 本『${f.workTitle}』を回し読みします（持っていなくてOK）`;
      return '';
    }
    const fullCaption = (f) => (f.body ? f.body.trim() + '\n\n' : '') + captionInfo(f);

    // ---------- 画面 ----------
    function render() {
      $$('.tabs button').forEach((b) => b.classList.toggle('active', b.dataset.tab === S.tab));
      if (S.tab === 'create') renderCreate();
      else if (S.tab === 'events') renderEvents();
      else renderRequests();
    }

    function renderCreate() {
      const f = S.form;
      const c = S.data.config;
      const hosts = S.data.hosts;
      const times = [];
      for (let m = 9 * 60; m <= 18 * 60; m += 30) times.push(String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0'));

      $('#app').innerHTML = `
        ${S.published ? `
          <div class="card" style="border:2px solid var(--main)">
            <h3>🌿 公開しました。募集がはじまりました</h3>
            <p class="meta">画像を保存し、下の投稿文をコピーして、ここちのInstagramに投稿してください（ホストを共同投稿者／メンションに）。</p>
            <div class="copy-row"><input type="text" readonly value="${esc(S.published.link)}"><button class="btn small" data-copy="${esc(S.published.link)}">申込リンクをコピー</button></div>
            <button class="btn ghost small" id="new-form" style="margin-top:12px">新しい木陰をつくる</button>
          </div>` : ''}
        <div class="grid2">
          <section>
            <div class="card">
              <h3>① 企画の中身（打ち合わせしながら入力）</h3>
              <label class="field"><span>ホスト<span class="req">必須</span></span>
                <select id="f-host">
                  ${f.hostId ? '' : '<option value="" selected>選んでください</option>'}
                  ${hosts.map((h) => `<option value="${esc(h.id)}" ${h.id === f.hostId ? 'selected' : ''}>${esc(h.name)}（${h.staff ? '運営・費用なし' : esc(h.role) + '・区分どおりの料金'}）</option>`).join('')}
                </select>
                <p class="hint">公式LINEを友だち追加した人（名簿にいる人）から選べます。一般の方もホストになれます。</p>
              </label>
              <p class="hint" style="margin-top:-6px;margin-bottom:12px">${isStaffHost(f) ? '運営がホストの回は、ホストを参加者に登録せず、人数にも数えません。' : 'ホストは参加者として登録され、人数に数えます。料金は区分どおり（IQ受講生は場所代のみ、一般の方は一般の初回／2回目以降）。'}</p>
              <label class="field"><span>型<span class="req">必須</span></span>
                <select id="f-format">
                  ${f.format ? '' : '<option value="" selected>選んでください</option>'}
                  ${S.data.formats.map((x) => `<option value="${esc(x.key)}" ${x.key === f.format ? 'selected' : ''}>${esc(x.label)}（${esc(x.series)}）</option>`).join('')}
                </select>
              </label>
              ${fmtOf(f) && fmtOf(f).work ? `<label class="field"><span>${esc(fmtOf(f).work.label)}${fmtOf(f).work.required ? '<span class="req">必須</span>' : '（任意）'}</span><input type="text" id="f-work" value="${esc(f.workTitle)}"></label>` : ''}
              <label class="field"><span>企画のテーマ・やりたいこと・想い<span class="req">必須</span></span>
                <textarea id="f-idea" rows="6" placeholder="思いつくままに、たらたら書いてOK。例）人の目を気にして疲れちゃう人と、痛みと願いカードで自分の願いを見つける時間にしたい">${esc(f.idea)}</textarea></label>
              <div class="row">
                <label class="field"><span>開催日<span class="req">必須</span></span><input type="date" id="f-date" min="${minDate()}" value="${esc(f.date)}"></label>
                <label class="field"><span>開始時間<span class="req">必須</span>（本編${c.core}時間＋${c.duration - c.core}時間）</span>
                  <select id="f-start">${times.map((t) => `<option ${t === f.start ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
              </div>
              <p class="hint" id="f-timeinfo" style="margin-top:-6px;margin-bottom:12px"></p>
              <div class="row">
                <label class="field"><span>場所<span class="req">必須</span></span><input type="text" id="f-venue" value="${esc(f.venue)}"></label>
                <label class="field"><span>定員（ホスト含む）<span class="req">必須</span></span><input type="number" id="f-max" min="1" max="30" value="${esc(f.max)}"></label>
              </div>
              ${isOtherVenue(f) ? `<div class="row">
                <label class="field"><span>場所代の合計（円）<span class="req">必須</span></span><input type="number" id="f-venuefee" min="0" step="10" value="${esc(f.venueFeeTotal)}"><span class="hint" style="display:block;font-weight:400">無料なら0</span></label>
                <label class="field"><span>1人あたりの上限（円）${Number(f.venueFeeTotal) > 0 ? '<span class="req">必須</span>' : ''}</span><input type="number" id="f-venuecap" min="0" step="10" value="${esc(f.venueFeeCap)}"><span class="hint" style="display:block;font-weight:400">割り勘がこれを超えたら、足りない分はホストが負担</span></label>
              </div>${venueExample(f)}` : `<p class="hint" style="margin-top:-6px;margin-bottom:12px">場所代：1人${yen(c.fees.venue)}（運営以外）。別の場所を入れると、場所代の合計を割り勘にできます。</p>`}
              <button class="btn block" id="f-gen">${S.generating ? '<span class="spinner" style="width:18px;height:18px;margin:0;border-width:2px"></span> AIが木陰の言葉を紡いでいます…' : '✨ AIで文章をつくる'}</button>
            </div>

            <div class="card">
              <h3>② 文章を一緒に整える</h3>
              <label class="field"><span>タイトル<span class="req">必須</span>（20文字くらい）</span><input type="text" id="f-title" value="${esc(f.title)}"></label>
              <label class="field"><span>案内文<span class="req">必須</span>（画像と申込画面に載ります）</span><textarea id="f-desc" rows="3">${esc(f.description)}</textarea></label>
              <label class="field"><span>Instagram投稿の本文</span><textarea id="f-body" rows="6">${esc(f.body)}</textarea></label>
              <details><summary>日時・料金・ハッシュタグ入りの投稿文（自動で組み立て）</summary>
                <textarea id="f-caption" rows="14" readonly style="margin-top:8px;font-size:13px"></textarea>
              </details>
              <button class="btn ghost small" id="f-copycap" style="margin-top:10px">投稿文をコピー</button>
            </div>
          </section>

          <section>
            <div class="card">
              <h3>③ 画像</h3>
              <p class="hint" style="margin-top:-4px">Instagram投稿用（4:5・1080×1350）</p>
              <div class="bg-list" id="f-bgs">
                ${BACKGROUNDS.map((b) => `<button data-bg="${b.id}" class="${S.bgId === b.id ? 'active' : ''}" style="background-image:url('${b.src}')" aria-label="背景 ${b.id}"></button>`).join('')}
                <button data-bg="upload" class="${S.bgId === 'upload' ? 'active' : ''}" style="${S.uploadImg ? `background-image:url('${S.uploadImg.src}')` : ''}">${S.uploadImg ? '' : '＋写真を<br>選ぶ'}</button>
              </div>
              <input type="file" id="f-file" accept="image/*" hidden>
              <p class="hint">どの写真を選んでも、木陰の枠が必ず重なります。</p>
              <canvas id="poster" class="preview"></canvas>
              <div class="toolbar" style="margin-top:12px">
                <button class="btn" id="f-download">画像を保存</button>
              </div>
            </div>

            <div class="card">
              <h3>④ 公開して募集をはじめる</h3>
              <p class="meta">公開すると申込画面に並びます。人数に関係なく開催し（ホストだけでもOK）、当日の開始時刻まで申し込めます。${c.noticeDays}日前の${c.noticeHour}時に、参加者へリマインド、運営へ人数をLINEでお知らせします。${isStaffHost(f) ? '運営がホストの回は、ホストを参加者に登録せず、人数にも数えません。' : 'ホストは自動で参加者に登録されます（料金は区分どおり）。'}</p>
              <ul class="hint" id="f-missing" style="color:var(--warn)"></ul>
              <button class="btn block" id="f-publish">公開して募集開始</button>
            </div>
          </section>
        </div>`;

      bindCreate();
      syncForm();
      redraw();
    }

    function isOtherVenue(f) { return (f.venue || '').trim() !== '' && f.venue.trim() !== S.data.config.venue; }

    function isStaffHost(f) {
      const h = S.data.hosts.find((x) => x.id === f.hostId);
      return !!(h && h.staff);
    }

    function readForm() {
      const f = S.form;
      f.hostId = $('#f-host').value;
      f.idea = $('#f-idea').value;
      f.format = $('#f-format').value;
      f.workTitle = $('#f-work') ? $('#f-work').value.trim() : '';
      f.date = $('#f-date').value;
      f.start = $('#f-start').value;
      f.venue = $('#f-venue').value.trim();
      if ($('#f-venuefee')) f.venueFeeTotal = $('#f-venuefee').value;
      if ($('#f-venuecap')) f.venueFeeCap = $('#f-venuecap').value;
      f.max = Number($('#f-max').value);
      f.title = $('#f-title').value.trim();
      f.description = $('#f-desc').value.trim();
      f.body = $('#f-body').value;
    }

    function missingFields() {
      const f = S.form;
      const miss = [];
      if (!f.hostId) miss.push(['#f-host', 'ホスト']);
      if (!f.format) miss.push(['#f-format', '型']);
      else if (fmtOf(f).work && fmtOf(f).work.required && !f.workTitle) miss.push(['#f-work', fmtOf(f).work.label]);
      if (!f.idea.trim()) miss.push(['#f-idea', '企画のテーマ・想い']);
      if (!f.date) miss.push(['#f-date', '開催日']);
      else if (f.date < minDate()) miss.push(['#f-date', '開催日（今日以降に）']);
      if (!f.start) miss.push(['#f-start', '開始時間']);
      if (!f.venue) miss.push(['#f-venue', '場所']);
      if (!f.max || f.max < 1) miss.push(['#f-max', '定員（1名以上）']);
      if (isOtherVenue(f) && String(f.venueFeeTotal).trim() === '') miss.push(['#f-venuefee', '場所代の合計']);
      if (isOtherVenue(f) && Number(f.venueFeeTotal) > 0 && !(Number(f.venueFeeCap) > 0)) miss.push(['#f-venuecap', '1人あたりの上限']);
      if (!f.title) miss.push(['#f-title', 'タイトル']);
      if (!f.description) miss.push(['#f-desc', '案内文']);
      return miss;
    }

    function syncForm() {
      readForm();
      const f = S.form;
      const c = S.data.config;
      $('#f-timeinfo').textContent = f.date ? `${dateLabel(f.date)} ${f.start}〜${addHours(f.start, c.duration)}（本編2時間＋感想の投稿・フリートーク1時間）` : '';
      $('#f-caption').value = fullCaption(f);
      const miss = missingFields();
      $$('.invalid').forEach((el) => el.classList.remove('invalid'));
      $('#f-missing').innerHTML = miss.map((m) => `<li>${esc(m[1])}が未入力です</li>`).join('');
      $('#f-publish').disabled = miss.length > 0;
    }

    let redrawTimer;
    function redraw() {
      clearTimeout(redrawTimer);
      redrawTimer = setTimeout(async () => {
        if (!$('#poster')) return;
        const f = S.form;
        const bg = S.bgId === 'upload' ? S.uploadImg : S.bgImg;
        await KokagePoster.draw($('#poster'), {
          format: S.format, bg,
          title: f.title || 'タイトル', description: f.description || '案内文がここに入ります',
          kicker: posterKicker(f), series: seriesOf(f),
          dateLabel: f.date ? dateLabel(f.date) : '開催日', time: `${f.start}〜${addHours(f.start, S.data.config.duration)}`,
          venue: f.venue, handle: S.data.config.instagramHandle
        });
      }, 250);
    }

    function seriesOf(f) { const x = fmtOf(f); return (x && x.series) || '木陰の対話会'; }
    function posterKicker(f) {
      const x = fmtOf(f);
      if (!x) return '';
      if (f.workTitle && x.key === 'movie') return `映画『${f.workTitle}』`;
      if (f.workTitle && x.key === 'reading') return `『${f.workTitle}』`;
      return x.kicker || '';
    }
    // 上限つき割り勘の例（打ち合わせで上限を決めるときの目安）
    function venueExample(f) {
      const total = Number(f.venueFeeTotal) || 0, cap = Number(f.venueFeeCap) || 0;
      if (!total || !cap) return '';
      const ex = [1, 2, 3, 4, 6, 8].map((n) => {
        const share = Math.min(cap, Math.ceil(total / n / 10) * 10);
        const host = Math.max(0, total - share * (n - 1));
        return `${n}人：参加者${yen(n > 1 ? share : 0)}・ホスト${yen(host)}`;
      });
      return `<p class="hint" style="margin-top:-6px;margin-bottom:12px">目安（運営がホストの場合、ホスト分は運営が負担）：<br>${ex.join('／')}</p>`;
    }

    async function selectBg(id) {
      S.bgId = id;
      const b = BACKGROUNDS.find((x) => x.id === id);
      S.bgImg = b ? await KokagePoster.loadImage(b.src).catch(() => null) : null;
      $$('#f-bgs button').forEach((el) => el.classList.toggle('active', el.dataset.bg === id));
      redraw();
    }

    function bindCreate() {
      $('#f-host').addEventListener('change', () => { readForm(); renderCreate(); });
      $('#f-format').addEventListener('change', () => { readForm(); renderCreate(); });
      if ($('#f-work')) ['input', 'change'].forEach((t) => $('#f-work').addEventListener(t, () => { syncForm(); redraw(); }));
      // 場所を変えたら、割り勘の欄を出し入れする
      $('#f-venue').addEventListener('change', () => { readForm(); renderCreate(); });
      ['#f-venuefee', '#f-venuecap'].forEach((sel) => { if ($(sel)) $(sel).addEventListener('change', () => { readForm(); renderCreate(); }); });
      ['#f-idea', '#f-date', '#f-start', '#f-venue', '#f-max', '#f-title', '#f-desc', '#f-body'].forEach((sel) => {
        $(sel).addEventListener('input', () => { syncForm(); redraw(); });
        $(sel).addEventListener('change', () => { syncForm(); redraw(); });
      });
      $('#f-gen').addEventListener('click', generate);
      $('#f-copycap').addEventListener('click', () => copy(fullCaption(S.form), '投稿文をコピーしました'));
      $$('#f-bgs button').forEach((b) => b.addEventListener('click', () => {
        if (b.dataset.bg === 'upload') { $('#f-file').click(); return; }
        selectBg(b.dataset.bg);
      }));
      $('#f-file').addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async () => {
          S.uploadImg = await KokagePoster.loadImage(reader.result);
          S.bgId = 'upload';
          readForm(); renderCreate();
        };
        reader.readAsDataURL(file);
      });
      $('#f-download').addEventListener('click', download);
      $('#f-publish').addEventListener('click', publish);
      if ($('#new-form')) $('#new-form').addEventListener('click', () => { S.published = null; S.form = blankForm(); renderCreate(); });
      $$('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.dataset.copy, 'コピーしました')));
    }

    async function generate() {
      readForm();
      if (!S.form.idea.trim()) { $('#f-idea').classList.add('invalid'); toast('企画のテーマ・想いを入力してください', true); return; }
      if (S.generating) return;
      if ((S.form.title || S.form.description || S.form.body) && !confirm('いまのタイトル・案内文・本文を、AIの新しい案で置き換えますか？')) return;
      S.generating = true; renderCreate();
      try {
        const host = S.data.hosts.find((h) => h.id === S.form.hostId);
        const res = await api('admin.generate', { idea: S.form.idea, format: S.form.format, workTitle: S.form.workTitle, hostName: host ? host.name : '' });
        S.form.title = res.copy.title;
        S.form.description = res.copy.description;
        S.form.body = res.copy.caption;
      } catch (e) { toast(e.message, true); }
      S.generating = false; renderCreate();
    }

    function download() {
      const canvas = $('#poster');
      const name = `kokage_${S.form.date || 'draft'}.png`;
      canvas.toBlob((blob) => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
        toast('画像を保存しました（スマホでうまく保存できない場合は、画像を長押ししてください）');
      }, 'image/png');
    }

    async function publish() {
      syncForm();
      const miss = missingFields();
      if (miss.length) { miss.forEach((m) => $(m[0]).classList.add('invalid')); return; }
      const f = S.form;
      if (!confirm(`『${f.title}』\n${dateLabel(f.date)} ${f.start}〜\nこの内容で公開して、募集をはじめますか？`)) return;
      const btn = $('#f-publish'); btn.disabled = true; btn.textContent = '公開しています…';
      try {
        const res = await api('admin.createEvent', {
          hostId: f.hostId, format: f.format, workTitle: f.workTitle, idea: f.idea, date: f.date, start: f.start, venue: f.venue, venueFeeTotal: f.venueFeeTotal, venueFeeCap: f.venueFeeCap, max: f.max,
          title: f.title, description: f.description, caption: fullCaption(f)
        });
        S.published = res;
        toast('公開しました🌿');
        S.data = await api('admin.overview');
        renderCreate();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } catch (e) {
        toast(e.message, true);
        btn.disabled = false; btn.textContent = '公開して募集開始';
      }
    }

    // ---------- イベント一覧 ----------
    function badge(status) {
      const cls = { '終了': 'done' }[status] || '';
      return `<span class="badge ${cls}">${esc(status)}</span>`;
    }

    function renderEvents() {
      const d = S.data;
      const today = localIso(new Date());
      const list = d.events.filter((e) => S.eventFilter === 'all' || e.date >= today || e.status === '募集中');
      $('#app').innerHTML = `
        <div class="toolbar" style="margin-bottom:14px">
          <div class="seg" style="margin:0">
            <button data-f="upcoming" class="${S.eventFilter === 'upcoming' ? 'active' : ''}">これから</button>
            <button data-f="all" class="${S.eventFilter === 'all' ? 'active' : ''}">すべて</button>
          </div>
          <span class="stat">今月のLINE自動送信（Push）：${d.pushCount} / ${d.pushLimit}通</span>
          <a class="btn ghost small" href="${esc(d.spreadsheetUrl)}" target="_blank" rel="noopener">スプレッドシートを開く</a>
          <button class="btn ghost small" id="reload">最新にする</button>
        </div>
        ${list.length ? list.map(eventAdminCard).join('') : '<div class="empty">イベントはまだありません。</div>'}`;
      $$('[data-f]').forEach((b) => b.addEventListener('click', () => { S.eventFilter = b.dataset.f; renderEvents(); }));
      $('#reload').addEventListener('click', reload);
      $$('[data-copy]').forEach((b) => b.addEventListener('click', () => copy(b.dataset.copy, 'コピーしました')));
      $$('[data-copyevent]').forEach((b) => b.addEventListener('click', () => copyEvent(b.dataset.copyevent)));
    }

    function eventAdminCard(ev) {
      const c = ev.counts;
      const cfg = S.data.config;
      const regs = ev.registrations;
      const sales = regs.filter((r) => r.status === '申込').reduce((s, r) => s + r.fee, 0);
      return `
        <article class="card">
          <div class="badges">${badge(ev.status)}${ev.format !== 'other' && ev.formatLabel ? `<span class="badge">${esc(ev.formatLabel)}</span>` : ''}</div>
          <h3>${esc(ev.title)}</h3>
          <div class="meta">
            <div>📅 ${esc(ev.dateLabel)} ${esc(ev.start)}〜${esc(ev.end)}　📍 ${esc(ev.venue)}</div>
            <div>🌿 ホスト：${esc(ev.host || 'なし')}　／　定員 ${ev.max}名</div>
            ${ev.venueSplit ? `<div>💴 場所代 合計${yen(ev.venueFeeTotal)}・上限1人${yen(ev.venueFeeCap)}（いまの人数で参加者${yen(ev.venueShareNow)}・ホスト${yen(ev.hostVenueFeeNow)}）</div>` : ''}
            ${ev.status === '募集中' ? `<div>⏰ 運営への人数のお知らせ：${esc(ev.noticeLabel)}${ev.noticeSent ? '（送信済み）' : ''}</div>` : ''}
          </div>
          <div class="counts">
            合計 <b>${c.total}</b>名　一般 <b>${c.guests}</b>名　仲間・ホスト ${c.members}名（運営は含まない）　／　当日集金予定 ${yen(sales)}
          </div>
          <div class="copy-row" style="margin-bottom:8px"><input type="text" readonly value="${esc(ev.link)}"><button class="btn small ghost" data-copy="${esc(ev.link)}">申込リンク</button></div>
          <button class="btn small ghost" data-copyevent="${esc(ev.id)}">同じ内容で別の日につくる</button>
          <details style="margin-top:8px"><summary>申込者（${regs.length}件）</summary>
            ${regs.length ? `<table class="regs"><thead><tr><th>名前</th><th>区分</th><th>当日</th><th>初回</th><th>シェア</th><th>紹介・きっかけ</th></tr></thead><tbody>
              ${regs.map((r) => `<tr class="${r.status === 'キャンセル' ? 'cancelled' : ''}"><td>${esc(r.name)}${r.isHost ? '（ホスト）' : ''}</td><td>${esc(r.type)}</td><td>${yen(r.fee)}</td><td>${r.first ? '○' : ''}</td><td>${r.share ? '○' : ''}</td><td>${esc(r.referrer)}</td></tr>`).join('')}
            </tbody></table>` : '<p class="hint">まだ申込はありません。</p>'}
          </details>
        </article>`;
    }

    function copyEvent(id) {
      const ev = S.data.events.find((e) => e.id === id);
      if (!ev) return;
      S.form = Object.assign(blankForm(), {
        hostId: ev.hostId || S.data.me.id, format: ev.format, workTitle: ev.workTitle || '', idea: ev.rawIdea || '', venue: ev.venue,
        venueFeeTotal: ev.venueSplit ? String(ev.venueFeeTotal) : '', venueFeeCap: ev.venueFeeCap ? String(ev.venueFeeCap) : '', max: ev.max, start: ev.start,
        title: ev.title, description: ev.description, body: String(ev.caption || '').split('──────────')[0].trim()
      });
      S.published = null;
      S.tab = 'create';
      render();
      window.scrollTo({ top: 0 });
      toast('新しい開催日を選んで公開してください');
    }

    function renderRequests() {
      const reqs = S.data.requests;
      $('#app').innerHTML = reqs.length
        ? `<p class="hint" style="margin-bottom:12px">一般の方から届いた「木陰で扱ってほしいテーマ」です。メンバーとの打ち合わせのヒントに。</p>` +
          reqs.map((r) => `<div class="card"><p class="meta">${esc(r.at)}　${esc(r.name)}</p><p style="margin:0;white-space:pre-wrap">${esc(r.text)}</p></div>`).join('')
        : '<div class="empty">まだお便りはありません。</div>';
    }

    async function copy(text, msg) {
      try { await navigator.clipboard.writeText(text); toast(msg); }
      catch (e) { prompt('コピーしてください', text); }
    }

    async function reload() {
      try { S.data = await api('admin.overview'); render(); toast('最新にしました'); } catch (e) { toast(e.message, true); }
    }

    (async function main() {
      try {
        if (!(await initLiff())) return;
        S.data = await api('admin.overview');
        S.form = blankForm();
        await selectBg('tree').catch(() => {});
        render();
      } catch (e) {
        $('#app').innerHTML = `<div class="card empty">${esc(e.message)}<br><br><span class="hint">運営メンバーとして登録するには、公式LINEのトークで「ID」と送ると届くユーザーIDを、Apps Script のスクリプト プロパティ ADMIN_LINE_USER_IDS に追加してください。</span></div>`;
      }
    })();
  })();
  </script>
</body>
</html>
